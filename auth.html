<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>შესვლა / რეგისტრაცია | HELF ME</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <header>
  <h1>HELF ME</h1>
  <p>დახმარება იწყება ერთი კითხვით.</p>
</header>

<main>
  <h2>შესვლა ან რეგისტრაცია</h2>
  <form id="authForm">
  <label for="email">ელფოსტა</label>
  <input
    type="email"
    id="email"
    name="email"
    autocomplete="email"
    required
  >
  <label for="password">პაროლი</label>
<input
  type="password"
  id="password"
  name="password"
  autocomplete="current-password"
  minlength="8"
  required
>
<button type="submit" id="loginButton">შესვლა</button>
<button type="button" id="signupButton">რეგისტრაცია</button>
<p id="authMessage" role="status" aria-live="polite"></p>
  </form>
  <p>
  <a href="index.html">← მთავარ გვერდზე დაბრუნება</a>
  </p>
  </main>
</body>
</html>
