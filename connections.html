<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ჩემი კავშირები | HELF ME</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="connections.js" defer></script>
</head>

<body>

  <header>
    <h1>HELF ME</h1>
    <p>ადამიანი ადამიანს.</p>
  </header>

  <main>

    <section aria-labelledby="connectionsTitle">

      <h2 id="connectionsTitle">ჩემი კავშირები</h2>

      <p
        id="connectionsStatus"
        role="status"
        aria-live="polite">
        მოთხოვნები იტვირთება...
      </p>

      <h2>შემოსული მოთხოვნები</h2>

      <div
        id="receivedConnections"
        aria-live="polite">
      </div>

      <h2>ჩემი გაგზავნილი მოთხოვნები</h2>

      <div
        id="sentConnections"
        aria-live="polite">
      </div>

    </section>

    <p>
      <a href="index.html">
        ← მთავარ გვერდზე დაბრუნება
      </a>
    </p>

  </main>

</body>
</html>
