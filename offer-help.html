<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>შემიძლია დახმარება | HELF ME</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>HELF ME</h1>
    <p>დახმარება იწყება ერთი კეთილი ნაბიჯით.</p>
  </header>

  <main>
    <h2>რით შეგიძლია დახმარება?</h2>
    <p>მოკლედ აღწერე, რა სახის დახმარების შეთავაზება შეგიძლია.</p>

    <label for="category">დახმარების კატეგორია</label>
    <select id="category" name="category">
      <option value="">აირჩიე კატეგორია</option>
      <option value="physical">ფიზიკური დახმარება</option>
      <option value="service">მომსახურება</option>
      <option value="information">ინფორმაცია / რჩევა</option>
      <option value="transport">ტრანსპორტი</option>
      <option value="other">სხვა</option>
    </select>

    <label for="description">რით შეგიძლია დახმარება?</label>
    <textarea id="description" name="description"
      placeholder="აღწერე, როგორ შეგიძლია დაეხმარო ადამიანს..."></textarea>

    <button type="button">დახმარების შეთავაზება</button>

    <p><a href="index.html">← მთავარ გვერდზე დაბრუნება</a></p>
  </main>
</body>
</html>
